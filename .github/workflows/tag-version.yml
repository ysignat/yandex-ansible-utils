name: Tag synchronized version

on:
  push:
    branches:
      - main

permissions:
  contents: write

concurrency:
  group: tag-version-main
  cancel-in-progress: false

jobs:
  checks:
    name: Run project checks
    uses: ./.github/workflows/checks.yml

  tag-version:
    name: Validate versions and create tag
    needs: checks
    runs-on: ubuntu-latest
    outputs:
      created: ${{ steps.create_tag.outputs.created }}

    steps:
      - name: Check out the pushed commit
        uses: actions/checkout@9f698171ed81b15d1823a05fc7211befd50c8ae0 # v6.0.3
        with:
          fetch-depth: 0

      - name: Create and push tag
        id: create_tag
        env:
          VERSION: ${{ needs.checks.outputs.version }}
        shell: bash
        run: |
          tag_ref="refs/tags/${VERSION}"

          if git rev-parse --verify --quiet "${tag_ref}^{commit}" >/dev/null; then
            tagged_commit="$(git rev-parse "${tag_ref}^{commit}")"
            echo "Tag ${VERSION} already exists at ${tagged_commit}; nothing to do."
            echo "created=false" >> "${GITHUB_OUTPUT}"
            exit 0
          fi

          git config user.name "Boots"
          git config user.email "boots@github-actions.invalid"
          git tag --annotate "${VERSION}" --message "Release ${VERSION}" "${GITHUB_SHA}"
          git push origin "${tag_ref}"
          echo "created=true" >> "${GITHUB_OUTPUT}"

  release:
    name: Build and publish release
    needs:
      - checks
      - tag-version
    if: needs.tag-version.outputs.created == 'true'
    runs-on: ubuntu-latest
    env:
      ANSIBLE_LOCAL_TEMP: /tmp/ansible-yandex-release
      VERSION: ${{ needs.checks.outputs.version }}

    steps:
      - name: Check out tagged commit
        uses: actions/checkout@9f698171ed81b15d1823a05fc7211befd50c8ae0 # v6.0.3
        with:
          ref: ${{ needs.checks.outputs.version }}

      - name: Set up Python
        uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6.3.0
        with:
          python-version: "3.14"

      - name: Install Poetry
        run: pipx install poetry==2.4.1

      - name: Install dependencies
        run: poetry install --no-interaction

      - name: Export collection runtime requirements
        run: poetry export -f requirements.txt --output src/requirements.txt

      - name: Build collection tarball
        run: >-
          poetry run ansible-galaxy collection build src
          --output-path /tmp/ansible-yandex-release
          --force

      - name: Create GitHub release and upload tarball
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          artifact="/tmp/ansible-yandex-release/ysignat-yandex-${VERSION}.tar.gz"
          gh release create "${VERSION}" "${artifact}" \
            --verify-tag \
            --title "${VERSION}" \
            --generate-notes

      - name: Publish collection to Ansible Galaxy
        env:
          ANSIBLE_GALAXY_SERVER_GALAXY_TOKEN: ${{ secrets.ANSIBLE_GALAXY_API_KEY }}
          ANSIBLE_GALAXY_SERVER_GALAXY_URL: https://galaxy.ansible.com
          ANSIBLE_GALAXY_SERVER_LIST: galaxy
        shell: bash
        run: |
          if [[ -z "${ANSIBLE_GALAXY_SERVER_GALAXY_TOKEN}" ]]; then
            echo "::error title=Missing Galaxy credential::Add the ANSIBLE_GALAXY_API_KEY repository secret."
            exit 1
          fi

          poetry run ansible-galaxy collection publish \
            "/tmp/ansible-yandex-release/ysignat-yandex-${VERSION}.tar.gz" \
            --server galaxy

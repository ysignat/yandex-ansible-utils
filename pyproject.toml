[project]
name = "yandex-ansible-utils"
version = "0.1.2"
description = "An Ansible collection providing utilities and integrations for managing and automating Yandex Cloud resources."
authors = [{ name = "ysignat", email = "ignatovegors@gmail.com" }]
readme = "README.md"
requires-python = ">=3.12,<3.15"
dependencies = ["grpcio (>=1.68.1,<2.0.0)", "yandexcloud (>=0.403.0,<0.404.0)"]

[build-system]
requires = ["poetry-core>=2.0.0,<3.0.0"]
build-backend = "poetry.core.masonry.api"

[tool.poetry]
packages = [{ include = "yandex_ansible_utils", from = "src/python" }]

[dependency-groups]
dev = [
  "ansible (>=14.3.0,<15.0.0)",
  "ansible-lint (>=26.8.0,<27.0.0)",
  "pytest (>=9.1.0,<10.0.0)",
  "ruff (>=0.16.3,<0.17.0)",
  "pytest-github-actions-annotate-failures (>=0.4.0,<0.5.0)",
]

[tool.poetry.requires-plugins]
poetry-plugin-export = ">=1.8"

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]

[tool.ruff]
line-length = 120

[tool.ruff.lint]
select = ["ALL"]
ignore = [
  "CPY001", # missing-copyright-notice
  "D100",   # undocumented-public-module
  "D105",   # undocumented-magic-method
  "EM101",  # raw-string-in-exception
  "EM102",  # f-string-in-exception
  "INP001", # implicit-namespace-package
  "TRY003", # raise-vanilla-args
]

[tool.ruff.lint.per-file-ignores]
"tests/**" = [
  "D101", # undocumented-public-class
  "D102", # undocumented-public-method
  "D103", # undocumented-public-function
  "D107", # undocumented-public-init
  "S101", # assert
  "S105", # hardcoded-password-string
]
